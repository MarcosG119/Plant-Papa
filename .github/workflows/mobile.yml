# Mobile app CI: Expo shell has no automated UI tests per the spec's testing
# policy, so CI enforces the typecheck; runtime verification is manual.
name: Mobile typecheck

'on':
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
